[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tapbot"
version = "0.1.0"
description = "Hardware-independent control core for TapBot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyserial>=3.5",
    "uvicorn>=0.30",
]

[project.scripts]
tapbot-camera-preview = "tapbot.vision.camera:main"
tapbot-grbl-check = "tapbot.robot.hardware_check:main"
tapbot-ui = "tapbot.ui.app:main"

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
